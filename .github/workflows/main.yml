name: Build macOS Standalone Binary

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller mss opencv-python pyttsx3 pyTelegramBotAPI pyAesCrypt secure-delete pyperclip

      - name: Compile to Binary
        run: |
          pyinstaller --onefile --clean my1script.py

      - name: Upload Executable
        uses: actions/upload-artifact@v4
        with:
          name: macos-binary
          path: dist/my1script
